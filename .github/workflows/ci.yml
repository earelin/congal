name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
  workflow_dispatch:

# Cancela execucións en curso da mesma rama/PR cando se empuxa de novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Dependencias do sistema: GTK3 (rfd, diálogos de ficheiro) e
      # X11/xkb (eframe/winit). TLS é rustls e SQLite vai bundled, así que
      # non fan falla openssl nin sqlite do sistema.
      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Comprobar formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # Os tests corren offline contra fixtures HTML/JSON.
      # `live_end_to_end` está marcado #[ignore] e non se executa aquí.
      - name: Tests
        run: cargo test --release --locked
