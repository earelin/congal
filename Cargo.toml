[package]
name = "congal"
version = "0.2.1-dev"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dark-light = "2.0.0"
directories = "6.0.0"
# `persistence` activa o gardado da posición/tamaño da ventá (e o seu restaurado
# ao abrir). Sen esta característica, eframe non persiste a xeometría da ventá.
eframe = { version = "0.34.3", features = ["persistence"] }
egui = "0.34.3"
egui_extras = "0.34.3"
encoding_rs = "0.8.35"
html-escape = "0.2.13"
open = "5.3.5"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "gzip", "cookies", "rustls", "form"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spreadsheet-ods = "1.0.4"
thiserror = "2.0.18"
